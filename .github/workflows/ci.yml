name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (kroute-server build.rs)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then brew install protobuf
          else sudo apt-get update && sudo apt-get install -y protobuf-compiler; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # kroute-server 纯 CPU 档（无 GPU 的 CI 环境官方支持形态）
      - run: cargo test -p kroute-server --no-default-features

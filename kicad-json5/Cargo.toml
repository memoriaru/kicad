[package]
name = "kicad-json5"
version = "0.9.0"
edition = "2021"
description = "KiCad S-expression ↔ JSON5 bidirectional compiler for schematics and PCBs"
authors = ["memo"]
license = "MIT"
repository = "https://github.com/memoriaru/kicad"
keywords = ["kicad", "pcb", "schematic", "sexpr", "json5"]
categories = ["parser-implementations", "development-tools"]
readme = "README.md"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# 错误处理
thiserror = "1"
anyhow = "1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json5 = "0.2"

# UUID 解析
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"

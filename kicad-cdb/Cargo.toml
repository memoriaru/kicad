[package]
name = "kicad-cdb"
version = "0.6.0"
edition = "2021"
description = "Component database and placement/routing/DRC engines for AI-assisted KiCad design"
license = "MIT"
repository = "https://github.com/memoriaru/kicad"
keywords = ["kicad", "pcb", "eda", "database", "router"]
categories = ["database", "development-tools"]
readme = "README.md"

[dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
kicad-json5 = { path = "../kicad-json5" }
kicad-symgen = { path = "../kicad-symgen" }
csv = "1"
toml = "0.8"
dirs = "5"
libc = "0.2"
rayon = "1.10"
wgpu = { version = "23", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
gpu-router = ["wgpu", "bytemuck", "pollster"]

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
kicad-render = { path = "../kicad-render" }

[dependencies.tempfile]
version = "3"

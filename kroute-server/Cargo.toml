[package]
name = "kroute-server"
version = "0.1.0"
edition = "2021"
description = "gRPC autorouting server for KiCad PCBs: wavefront (CPU/wgpu/CUDA) and freerouting backends"

license = "MIT"
repository = "https://github.com/memoriaru/kicad"
keywords = ["kicad", "pcb", "router", "grpc", "eda"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rayon = "1.10"
# 显存水位门：4090 是共享卡，CUDA 任务执行前查 free VRAM
nvml-wrapper = "0.10"
# LayoutOptimize RPC：远程多 seed SA 布局（run_sa_seeds）
kicad-cdb = { path = "../kicad-cdb" }
kicad-json5 = { path = "../kicad-json5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 引擎阶梯 gpu 档（Metal/Vulkan/DX12）：默认启用，运行时探测失败自动降 CPU
wgpu = { version = "23", optional = true }
bytemuck = { version = "1", optional = true }
pollster = { version = "0.4", optional = true }
cudarc = { version = "0.19.9", optional = true, features = ["driver", "nvrtc"] }

[build-dependencies]
tonic-build = "0.13"

[features]
# 引擎阶梯：cuda（生产 4090）→ gpu=wgpu（本机 Metal/Vulkan/DX12）→ cpu（永远兜底）。
# default 含 gpu：本机开箱即用 Metal；生产构建 --features cuda 后阶梯头是 CUDA。
default = ["gpu"]
gpu = ["wgpu", "bytemuck", "pollster"]
cuda = ["cudarc"]

[lib]
name = "kroute_server"
path = "src/lib.rs"

[[bin]]
name = "kroute-server"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
tokio-stream = "0.1"
